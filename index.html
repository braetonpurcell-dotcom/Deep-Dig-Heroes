<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deep Dig">
<meta name="description" content="Pixel-art mining idle game where solving math problems powers your strikes. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Deep Dig Heroes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div class="res coins"><img class="ic" data-icon="coin" alt="Coins"><b id="hCoins">0</b></div>
      <div class="res"><img class="ic" data-icon="key" alt="Keys"><b id="hKeys">0</b></div>
      <div class="res"><img class="ic" data-icon="core" alt="Cores"><b id="hCores">0</b></div>
      <div class="res"><img class="ic" data-icon="scrap" alt="Scrap"><b id="hScrap">0</b></div>
    </div>
    <div class="hud-row">
      <span class="lvl">Lv <b id="hLvl">1</b></span>
      <div class="xpbar" title="XP to next level"><i id="hXp"></i></div>
      <span class="dps">DPS <b id="hDps">0</b></span>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" width="320" height="192" aria-label="Your miner fighting in the mine"></canvas>
  </div>

  <div id="floorbar">
    <button id="fUp" class="fbtn" aria-label="Go up one floor">▲</button>
    <div class="finfo"><b id="fName">B1</b><span id="fBiome">Topsoil</span></div>
    <button id="fDown" class="fbtn" aria-label="Go down one floor">▼</button>
    <button id="fAuto" class="chip on" aria-pressed="true">Auto</button>
    <button id="fFight" class="chip hot" hidden>Fight<span class="xs-hide"> boss</span></button>
    <button id="fBoss" class="chip hot" hidden>Retry<span class="xs-hide"> boss</span></button>
    <button id="fPrestige" class="chip glow" hidden>Prestige</button>
  </div>

  <main id="panel">
    <section id="tab-fight" class="tab">
      <div id="ticker" class="ticker" aria-live="polite"></div>
      <div id="mathcard" class="card mathcard">
        <div class="problem"><span id="pQ" class="q">1 + 1</span><span id="pEq" class="eq">=</span><span id="pA" class="ans empty"></span></div>
        <div class="mathmeta">
          <span id="cMult" class="mult zero">×1.00</span>
          <div class="streakbar" title="Combo streak"><i id="cFill"></i></div>
          <span id="cStreak" class="num">0/20</span>
          <span>Math <b id="cLv">1</b></span>
          <button id="skip" class="skip">Skip</button>
        </div>
        <div class="timer" title="Answer before the bar empties for a QUICK bonus"><i id="pTimer"></i></div>
      </div>
      <div id="keypad" class="keypad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="clear" class="fn">Clear</button><button data-key="0">0</button><button data-key="back" class="fn" aria-label="Delete">⌫</button>
      </div>
      <div id="choices" class="choices" hidden></div>
      <div id="tappad" class="tappad" hidden></div>
      <div id="arena" class="arena"></div>
    </section>
    <section id="tab-forge" class="tab" hidden></section>
    <section id="tab-skills" class="tab" hidden></section>
    <section id="tab-cases" class="tab" hidden></section>
    <section id="tab-bag" class="tab" hidden></section>
    <section id="tab-quests" class="tab" hidden></section>
    <section id="tab-more" class="tab" hidden></section>
  </main>

  <nav id="tabs" aria-label="Game sections">
    <button data-tab="fight" class="on"><img data-icon="brain" alt=""><span>Fight</span><i class="dot"></i></button>
    <button data-tab="forge"><img data-icon="anvil" alt=""><span>Forge</span><i class="dot"></i></button>
    <button data-tab="skills"><img data-icon="star" alt=""><span>Skills</span><i class="dot"></i></button>
    <button data-tab="cases"><img data-icon="chest" alt=""><span>Cases</span><i class="dot"></i></button>
    <button data-tab="bag"><img data-icon="bag" alt=""><span>Bag</span><i class="dot"></i></button>
    <button data-tab="quests"><img data-icon="scroll" alt=""><span>Quests</span><i class="dot"></i></button>
    <button data-tab="more"><img data-icon="cog" alt=""><span>More</span><i class="dot"></i></button>
  </nav>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>

<script src="js/version.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/engine.js"></script>
<script src="js/backup.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/minigames.js"></script>
  <script src="js/tappad.js"></script>
<script src="js/main.js"></script>
</body>
</html>
