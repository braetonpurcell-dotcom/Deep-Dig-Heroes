<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dig BETA">
<meta name="description" content="Pixel-art mining idle game where tapping monsters powers your strikes. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Deep Dig Heroes BETA</title>
<link rel="stylesheet" href="style.css?v=1.10.2-beta">
<script>
  // Safety net: if an update ever arrives half-loaded and the game can't start, offer a one-tap
  // repair instead of a black screen. It clears the offline copy only; the save is untouched.
  setTimeout(function () {
    if (window.DDH_BOOTED) return;
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;inset:auto 16px 40% 16px;z-index:99;padding:16px;background:#1b1426;border:2px solid #ffcc4d;color:#f2e9d8;font:18px sans-serif;text-align:center');
    d.innerHTML = '<p style="margin:0 0 10px">The game update did not finish loading.</p>' +
      '<button style="font:inherit;padding:10px 16px;background:#ffcc4d;color:#1b1426;border:0">Repair and reload</button>' +
      '<p style="margin:10px 0 0;font-size:14px;opacity:.75">Your progress is safe.</p>';
    d.querySelector('button').onclick = function () {
      var go = function () { location.reload(); };
      var clear = window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
      clear.then(function () {
        return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0;
      }).then(go, go);
    };
    document.body.appendChild(d);
  }, 6000);
</script>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-top">
      <div class="hud-row">
        <div class="res coins"><img class="ic" data-icon="coin" alt="Coins"><b id="hCoins">0</b></div>
        <div class="res"><img class="ic" data-icon="key" alt="Keys"><b id="hKeys">0</b></div>
        <div class="res"><img class="ic" data-icon="core" alt="Cores"><b id="hCores">0</b></div>
        <div class="res"><img class="ic" data-icon="scrap" alt="Scrap"><b id="hScrap">0</b></div>
      </div>
      <span class="hudbtns">
        <button id="lbBtn" class="hudbtn" data-lb="open" aria-label="Leaderboard"><img class="ic" data-icon="trophy" alt=""></button>
        <button id="fbBtn" class="hudbtn" data-fb="open" aria-label="Feedback"><span>F</span><i class="dot"></i></button>
      </span>
    </div>
    <div class="hud-row">
      <span class="lvl">Lv <b id="hLvl">1</b></span>
      <div class="xpbar" title="XP to next level"><i id="hXp"></i></div>
      <span class="dps">DPS <b id="hDps">0</b></span>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" width="320" height="192" aria-label="Your miner fighting in the mine"></canvas>
  </div>

  <div id="floorbar">
    <button id="fUp" class="fbtn" aria-label="Go up one floor">▲</button>
    <div class="finfo"><b id="fName">B1</b><span id="fBiome">Topsoil</span></div>
    <button id="fDown" class="fbtn" aria-label="Go down one floor">▼</button>
    <button id="fAuto" class="chip on" aria-pressed="true">Auto</button>
    <button id="fFight" class="chip hot" hidden>Fight<span class="xs-hide"> boss</span></button>
    <button id="fBoss" class="chip hot" hidden>Retry<span class="xs-hide"> boss</span></button>
    <button id="fPrestige" class="chip glow" hidden>Prestige</button>
  </div>

  <main id="panel">
    <section id="tab-fight" class="tab">
      <div id="ticker" class="ticker" aria-live="polite"></div>
      <div id="combocard" class="card mathcard">
        <div class="mathmeta">
          <span id="cMult" class="mult zero">×1.00</span>
          <div class="streakbar" title="Combo"><i id="cFill"></i></div>
          <span id="cStreak" class="num">0/20</span>
          <span id="cShield" class="shield" hidden></span>
          <span id="cPace" class="num pace" title="Tap pad pace: it adjusts to you">Pace 0%</span>
        </div>
      </div>
      <div id="tappad" class="tappad" aria-label="Tap the monsters before their ring closes"></div>
      <div id="arena" class="arena"></div>
    </section>
    <section id="tab-forge" class="tab" hidden></section>
    <section id="tab-skills" class="tab" hidden></section>
    <section id="tab-cases" class="tab" hidden></section>
    <section id="tab-bag" class="tab" hidden></section>
    <section id="tab-quests" class="tab" hidden></section>
    <section id="tab-more" class="tab" hidden></section>
  </main>

  <nav id="tabs" aria-label="Game sections">
    <button data-tab="fight" class="on"><img data-icon="skull" alt=""><span>Fight</span><i class="dot"></i></button>
    <button data-tab="forge"><img data-icon="anvil" alt=""><span>Forge</span><i class="dot"></i></button>
    <button data-tab="skills"><img data-icon="star" alt=""><span>Skills</span><i class="dot"></i></button>
    <button data-tab="cases"><img data-icon="chest" alt=""><span>Cases</span><i class="dot"></i></button>
    <button data-tab="bag"><img data-icon="bag" alt=""><span>Bag</span><i class="dot"></i></button>
    <button data-tab="quests"><img data-icon="scroll" alt=""><span>Quests</span><i class="dot"></i></button>
    <button data-tab="more"><img data-icon="cog" alt=""><span>More</span><i class="dot"></i></button>
  </nav>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>

<script src="js/version.js?v=1.10.2-beta"></script>
<script src="js/beta.js?v=1.10.2-beta"></script>
<script src="js/util.js?v=1.10.2-beta"></script>
<script src="js/data.js?v=1.10.2-beta"></script>
<script src="js/sprites.js?v=1.10.2-beta"></script>
<script src="js/engine.js?v=1.10.2-beta"></script>
<script src="js/backup.js?v=1.10.2-beta"></script>
<script src="js/audio.js?v=1.10.2-beta"></script>
<script src="js/render.js?v=1.10.2-beta"></script>
<script src="js/ui.js?v=1.10.2-beta"></script>
<script src="js/minigames.js?v=1.10.2-beta"></script>
<script src="js/feedback.js?v=1.10.2-beta"></script>
<script src="js/leaderboard.js?v=1.10.2-beta"></script>
<script src="js/tappad.js?v=1.10.2-beta"></script>
<script src="js/main.js?v=1.10.2-beta"></script>
</body>
</html>
